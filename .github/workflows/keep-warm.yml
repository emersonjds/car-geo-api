name: keep-warm

# Plano free do Render dorme apos ~15 min ocioso; o 1o acesso (ex.: aba /docs)
# pega um cold start de 30-60s. Este ping a cada 14 min mantem a instancia acordada.
# ponytail: remover se migrar para um plano always-on (pago).

# Pinga `/` e nao `/health`: `/` responde sem tocar no banco, entao o ping mede o
# que ele realmente quer (o processo esta de pe?). `/health` faz `SELECT 1` e vira
# 500 quando o Postgres free do Render expira — isso quebrava o job a cada 14 min e
# enchia o e-mail de falha. Falha de banco e assunto do healthcheck do Render, nao do ping.

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://car-geo-api.onrender.com/
